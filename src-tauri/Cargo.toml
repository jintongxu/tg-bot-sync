[package]
name = "tg_bot_sync"
version = "0.1.0"
edition = "2021"

[lib]
name = "tg_bot_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-dialog = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls", "blocking"] }
chrono = "0.4"
rfd = "0.15"
image = "0.25"
anyhow = "1"
arboard = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
